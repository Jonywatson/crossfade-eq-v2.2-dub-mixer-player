<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
  <title>Crossfade Player v2.2 - 10-Band EQ</title>
  <meta name="description" content="True crossfade with 10-band EQ. Works on iPhone/Android/Desktop.">
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="XFade Player">

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- TOP -->
    <header class="top-fixed">
      <div class="top-row">
        <canvas id="spectrum" width="800" height="200"></canvas>
        <div class ="album-art-container">
          <img id="album-art" src="assets/default-art.svg" alt="" draggable="false" onerror="this.src='assets/default-art.svg'">
        </div>
        <div class="now-meta">
          <div id="now-title">Track Name</div>
          <div id="now-artist">Artist</div>
          <div id="now-album" class="album-text"></div>
        </div>
        <div class="folder-actions">
          <button id="add-songs-btn">+ Songs</button>
          <button id="add-folder-btn">+ Folder</button>
          <button id="delete-stuck">Delete All</button>
          <input type="text" id="search" placeholder="Search songs...">
          
        </div>
        
        </div>
      </div>
    </header>

    <!-- MIDDLE -->
    <main class="playlist">
      <div id="song-list"></div>
      <div id="lyrics-box" class="lyrics-box"></div>
    </main>

    <!-- BOTTOM -->
    <footer class="bottom-fixed">
      <div class="controls">
        <button id="prev">⏮</button>
        <button id="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="next">⏭</button>
        <button id="shuffle" title="Shuffle"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
        <button id="repeat" title="Repeat"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
        <button id="miniBtn" class="action-btn" title="Mini player">⊟</button>

        <select id="eq-preset">
          <option value="flat">Flat</option>
          <option value="bass">Bass</option>
          <option value="rock">Rock</option>
          <option value="pop">Pop</option>
          <option value="vocal">Vocal</option>
          <option value="electronic">Electronic</option>
          <option value="custom" disabled>Custom</option>
        </select>
        <button id="eq-btn">EQ</button>
        <span class="fade-label">Fade: <span id="fade-time">2.0s</span></span>
        <input type="range" id="fade-slider" min="0" max="5000" step="100" value="2000">
      </div>

      <div class="waveform-row">
        <canvas id="waveform"></canvas>
        <span id="timer">0:00 / 0:00</span>
      </div>

      <div class="vu-wrapper">
        <label>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
          <button id="volume-btn">🔊</button>
        </label>
      </div>

      <!-- EQ DRAWER -->
      <div id="eq-drawer">
        <div class="eq-header">
          <span>10-Band EQ</span>
          <select id="eq-preset-drawer">
            <option value="flat">Flat</option>
            <option value="bass">Bass</option>
            <option value="rock">Rock</option>
            <option value="pop">Pop</option>
            <option value="vocal">Vocal</option>
            <option value="electronic">Electronic</option>
          </select>
          <button id="eq-close">✕</button>
        </div>

        <div id="eq" class="eq-bands">
  <div class="eq-band">
    <span class="eq-value">0</span>
    <input type="range" class="eq-slider" data-band="0" min="-12" max="12" value="0" step="0.5">
    <span class="eq-freq">32</span>
  </div>
  <div class="eq-band">
    <span class="eq-value">0</span>
    <input type="range" class="eq-slider" data-band="1" min="-12" max="12" value="0" step="0.5">
    <span class="eq-freq">64</span>
  </div>
  <div class="eq-band">
    <span class="eq-value">0</span>
    <input type="range" class="eq-slider" data-band="2" min="-12" max="12" value="0" step="0.5">
    <span class="eq-freq">125</span>
  </div>
  <div class="eq-band">
    <span class="eq-value">0</span>
    <input type="range" class="eq-slider" data-band="3" min="-12" max="12" value="0" step="0.5">
    <span class="eq-freq">250</span>
  </div>
  <div class="eq-band">
    <span class="eq-value">0</span>
    <input type="range" class="eq-slider" data-band="4" min="-12" max="12" value="0" step="0.5">
    <span class="eq-freq">500</span>
  </div>
  <div class="eq-band">
    <span class="eq-value">0</span>
    <input type="range" class="eq-slider" data-band="5" min="-12" max="12" value="0" step="0.5">
    <span class="eq-freq">1k</span>
  </div>
  <div class="eq-band">
    <span class="eq-value">0</span>
    <input type="range" class="eq-slider" data-band="6" min="-12" max="12" value="0" step="0.5">
    <span class="eq-freq">2k</span>
  </div>
  <div class="eq-band">
    <span class="eq-value">0</span>
    <input type="range" class="eq-slider" data-band="7" min="-12" max="12" value="0" step="0.5">
    <span class="eq-freq">4k</span>
  </div>
  <div class="eq-band">
    <span class="eq-value">0</span>
    <input type="range" class="eq-slider" data-band="8" min="-12" max="12" value="0" step="0.5">
    <span class="eq-freq">8k</span>
  </div>
  <div class="eq-band">
    <span class="eq-value">0</span>
    <input type="range" class="eq-slider" data-band="9" min="-12" max="12" value="0" step="0.5">
    <span class="eq-freq">16k</span>
  </div>
</div>

        <div class="eq-controls">
          <button id="eq-reset">Reset</button>
        </div>
      </div>
    </footer>
  </div>

  <!-- Hidden inputs -->
  <input type="file" id="file-input" multiple accept="audio/*,.mp3,.m4a,.flac,.ogg,.wav" style="display:none">
  <input type="file" id="folder-input" webkitdirectory multiple style="display:none">

  <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>

  <script src="app.js" defer></script>
</body>
</html>
